name: Find piping jobs and public recruiting emails

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # 09:00 Asia/Kolkata
  pull_request:
    paths:
      - "scripts/find_jobs.py"
      - "scripts/run_job_search.py"
      - "scripts/merge_verified_job_leads.py"
      - "job_search_config.json"
      - "verified_job_leads.json"
      - ".github/workflows/job-search.yml"
      - "profile.json"
  push:
    branches: [main]
    paths:
      - "scripts/find_jobs.py"
      - "scripts/run_job_search.py"
      - "scripts/merge_verified_job_leads.py"
      - "job_search_config.json"
      - "verified_job_leads.json"
      - ".github/workflows/job-search.yml"
      - "profile.json"

permissions:
  contents: write

concurrency:
  group: piping-job-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile job-search programs
        run: |
          python -m py_compile \
            scripts/find_jobs.py \
            scripts/run_job_search.py \
            scripts/merge_verified_job_leads.py

      - name: Search current openings and public recruiting emails
        run: |
          python scripts/run_job_search.py \
            --config job_search_config.json \
            --profile profile.json \
            --output-dir job-results \
            --report proof/job-search-report.json

      - name: Enforce strict quality gate and merge verified leads
        run: python scripts/merge_verified_job_leads.py

      - name: Validate evidence files
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          required = [
              Path("job-results/latest_jobs.json"),
              Path("job-results/latest_jobs.csv"),
              Path("job-results/latest_job_emails.csv"),
              Path("job-results/latest_jobs.md"),
              Path("proof/job-search-report.json"),
          ]
          for path in required:
              assert path.is_file() and path.stat().st_size > 0, f"missing/empty: {path}"

          jobs = json.loads(required[0].read_text(encoding="utf-8"))
          report = json.loads(required[-1].read_text(encoding="utf-8"))
          assert report["status"] == "PASS", report
          assert report["quality_gate"] == "PASS", report
          assert report["final_evidence_backed_leads"] > 0, report
          assert jobs["job_count"] == len(jobs["jobs"])
          assert jobs["rejected_weak_hits"] >= 0
          with required[1].open(encoding="utf-8-sig", newline="") as handle:
              job_rows = list(csv.DictReader(handle))
          with required[2].open(encoding="utf-8-sig", newline="") as handle:
              email_rows = list(csv.DictReader(handle))
          assert len(job_rows) == jobs["job_count"]
          assert len(email_rows) >= 1, "no public recruiting-email evidence produced"
          print(json.dumps({
              "quality_gate": report["quality_gate"],
              "jobs": len(job_rows),
              "job_email_rows": len(email_rows),
              "weak_hits_rejected": report["rejected_weak_hits"],
          }, indent=2))
          PY

      - name: Upload job-search evidence
        uses: actions/upload-artifact@v4
        with:
          name: piping-job-search-${{ github.run_id }}
          path: |
            job-results/
            proof/job-search-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest results to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job-results proof/job-search-report.json
          git diff --cached --quiet && exit 0
          git commit -m "jobs: refresh piping openings and recruiting emails [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish race detected; retry ${attempt}/4"
            sleep 5
          done
          echo "ERROR: unable to publish job-search results after four attempts" >&2
          exit 1
